# Backing services for local development. The API and frontend run on the host
# (see README). Start with: docker compose up -d
#
# `docker compose --profile app up -d --build` also runs the deployable image (API and
# dashboard on http://localhost:8000), as Render runs it (docs/deployment.md).
services:
  db:
    image: postgres:18-alpine
    container_name: agentiq-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - agentiq_postgres18_clean_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Session cache and background job queue. Postgres stays the source of truth.
  redis:
    image: redis:8-alpine
    container_name: agentiq-redis
    restart: unless-stopped

    command: ["redis-server", "--appendonly", "yes"]

    ports:
      - "${REDIS_PORT:-56379}:6379"

    volumes:
      - agentiq_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    profiles: ["app"]
    container_name: agentiq-app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  agentiq_postgres18_clean_data:
  agentiq_redis_data:
