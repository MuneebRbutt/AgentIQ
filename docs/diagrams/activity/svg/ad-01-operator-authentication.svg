xt font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#000000"><tspan x="0.0" y="961.2">Revoke the session</tspan><tspan x="0.0" y="978.8">token</tspan></text><text font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#000000"><tspan x="420.0" y="450.0">Record a failed attempt</tspan></text><text font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#000000"><tspan x="420.0" y="561.8">Attempt limit</tspan><tspan x="420.0" y="578.1">reached?</tspan></text><text font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#000000"><tspan x="735.0" y="561.2">Lock the account for</tspan><tspan x="735.0" y="578.8">a set time</tspan></text><text font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#000000"><tspan x="420.0" y="772.5">Show a generic error:</tspan><tspan x="420.0" y="790.0">invalid email or</tspan><tspan x="420.0" y="807.5">password</tspan></text></svg>
