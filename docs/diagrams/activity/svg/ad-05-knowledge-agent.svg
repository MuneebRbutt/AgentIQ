ext><text font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#000000"><tspan x="0.0" y="531.2">Embed the chunks</tspan><tspan x="0.0" y="548.8">(MiniLM)</tspan></text><text font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#000000"><tspan x="0.0" y="631.2">Store the vectors in</tspan><tspan x="0.0" y="648.8">Chroma</tspan></text><text font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#000000"><tspan x="0.0" y="731.2">Save the document text</tspan><tspan x="0.0" y="748.8">in PostgreSQL</tspan></text><text font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#000000"><tspan x="0.0" y="840.0">Mark the document ready</tspan></text><text font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#000000"><tspan x="690.0" y="91.2">Receive a knowledge</tspan><tspan x="690.0" y="108.8">subtask</tspan></text><text font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#000000"><tspan x="690.0" y="200.0">Embed the question</tspan></text><text font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#000000"><tspan x="690.0" y="291.2">Search the profile's</tspan><tspan x="690.0" y="308.8">chunks (top-k)</tspan></text><text font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#000000"><tspan x="690.0" y="411.8">Relevant</tspan><tspan x="690.0" y="428.1">chunks found?</tspan></text><text font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#000000"><tspan x="1125.0" y="411.2">Say the information</tspan><tspan x="1125.0" y="428.8">isn't available</tspan></text><text font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#000000"><tspan x="690.0" y="531.2">Generate an answer from</tspan><tspan x="690.0" y="548.8">