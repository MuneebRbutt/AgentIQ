[project]
name = "agentiq-backend"
version = "0.1.0"
description = "AgentIQ: multi-agent AI calling agent for SMB customer support (backend API)"
requires-python = ">=3.12"
# Direct dependencies only. Exact, tested versions are pinned in requirements.txt.
dependencies = [
    "fastapi[standard]>=0.143,<0.144",
    "pydantic-settings>=2.15",
    "structlog>=25.4",
    "sqlalchemy[asyncio]>=2.1.4,<2.2",
    "asyncpg>=0.31",
    "alembic>=1.20",
    "redis>=6.4",
    "bcrypt>=5.0",
    "pyjwt>=2.15",
    "email-validator>=2.3",
    "pyyaml>=6.0",  # example business profiles are YAML
    "tzdata>=2025.2",  # time zone database; Windows doesn't ship one
    "chromadb>=1.1",  # vector store, embedded; also runs MiniLM through ONNX (ADR-0004)
    "pypdf>=6.0",  # text from uploaded PDFs
    "python-docx>=1.2",  # text from uploaded Word documents
    "httpx>=0.28",  # LLM provider calls
    "langgraph>=1.2,<1.3",  # orchestration graph (ADR-0005); pinned tightly, it moves fast
    # Sentiment model (ADR-0006). Already installed with chromadb; used directly now.
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "ruff>=0.17",
    "mypy>=1.20",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test; fixture passwords and tokens are fake by design
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# The local alembic/ folder would otherwise make the library look first-party.
known-third-party = ["alembic"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic"]

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]  # ships no type information
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the docker compose services (docker compose up -d); skipped when unreachable",
]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy runs async DB calls through greenlets; without this, code after them is missed.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
